<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<title>Sisufx Spider Crawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: một sân khấu dọc 9:16 (khung TikTok) ở giữa, thanh điều khiển nằm ngoài khung để quay sạch.
   Màu: neon trên nền đen-xanh kiểu terminal, chủ ý chỉ một theme tối. */
:root{
  --void:#05060a;        /* nền ngoài sân khấu */
  --ink:#0a0d14;         /* nền sân khấu */
  --tile:#0d1117;        /* nền "trang" github */
  --line:#262c38;        /* viền */
  --text:#e9edf5;        /* chữ chính */
  --mute:#7d8597;        /* chữ phụ */
  --cyan:#3ad6ff;        /* nhện / số nhện */
  --pink:#ff3d9a;        /* gửi Sisufx / giữ */
  --violet:#8b5cff;
  --link:#58a6ff;        /* tên repo kiểu github */
  --f-ui:"Be Vietnam Pro", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
.wrap{height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;padding-block:10px}
.cap{display:flex;gap:10px;align-items:center;font:600 13px/1.2 var(--f-ui);color:var(--mute);letter-spacing:.02em;max-width:100%;flex-wrap:wrap;justify-content:center}
.cap b{color:var(--text)}
.badge{font:700 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:#ffd23d;padding:4px 6px;border-radius:3px}
.stage{position:relative;aspect-ratio:9/16;height:min(calc(100% - 96px), calc((100vw - 32px) * 16 / 9));max-width:100%;background:var(--ink);border-radius:14px;overflow:hidden;container-type:inline-size;box-shadow:0 0 0 1px var(--line),0 30px 80px -20px rgba(255,61,154,.25)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* bộ đếm */
.hud{position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr 1fr 1.25fr 1.15fr;gap:2cqw;padding:3.2cqw 4cqw 3cqw;background:linear-gradient(var(--ink) 70%, transparent);z-index:3}
.hud div{display:flex;flex-direction:column;gap:.8cqw;min-width:0}
.hud span{font:700 2.1cqw/1 var(--f-mono);letter-spacing:.14em;color:var(--mute);white-space:nowrap}
.hud b{font:700 5.6cqw/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--text)}
.hud .c b{color:var(--cyan)} .hud .p b{color:var(--pink)}

/* giám khảo */
.judge{position:absolute;left:3.5cqw;right:3.5cqw;bottom:7.5cqw;display:grid;grid-template-columns:auto 1fr;gap:4cqw;align-items:center;padding:4cqw;border:1px solid rgba(255,61,154,.45);border-radius:3cqw;background:rgba(20,6,16,.88);backdrop-filter:blur(6px);z-index:3;transform:translateY(130%);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.judge.on{transform:none;opacity:1}
.av{display:flex;flex-direction:column;align-items:center;gap:1.4cqw}
.av svg{width:19cqw;height:19cqw;filter:drop-shadow(0 0 3cqw rgba(255,61,154,.55))}
.av span{font:700 2.4cqw/1 var(--f-mono);letter-spacing:.2em}
.jq{font:600 3.7cqw/1.25 var(--f-ui);margin:0 0 2.4cqw}
.jrow{display:flex;gap:4cqw;align-items:flex-start}
.jn{display:flex;flex-direction:column;gap:.8cqw}
.jn span{font:700 2cqw/1 var(--f-mono);letter-spacing:.14em;color:var(--mute)}
.jn b{font:700 6.4cqw/1 var(--f-mono);font-variant-numeric:tabular-nums}
.jn.k b{color:var(--pink)}
.judge > div:last-child{min-width:0}
.keep{flex:1;min-width:0;border-radius:2cqw;background:rgba(255,61,154,.14);border:1px solid rgba(255,61,154,.35);padding:2cqw 2.6cqw;display:flex;flex-direction:column;gap:.8cqw;opacity:0;transition:opacity .25s}
.keep.on{opacity:1}
.keep i{font:700 1.9cqw/1 var(--f-mono);font-style:normal;letter-spacing:.16em;color:var(--pink)}
.keep b{font:800 4.2cqw/1.1 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keep small{font:400 2.6cqw/1.25 var(--f-ui);color:#d9c4d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:1.4cqw;margin-top:2.4cqw}
.dots i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:#3a2232}
.dots i.on{background:var(--pink);box-shadow:0 0 1.5cqw var(--pink)}

/* danh sách cuối */
.final{position:absolute;left:3.5cqw;right:3.5cqw;top:17cqw;bottom:13cqw;border:1px solid rgba(255,61,154,.5);border-radius:3cqw;background:rgba(8,9,14,.94);padding:5cqw 5.5cqw;display:flex;flex-direction:column;gap:3cqw;z-index:4;opacity:0;transform:scale(.97);transition:opacity .5s,transform .5s;pointer-events:none;overflow:hidden}
.final.on{opacity:1;transform:none}
.final header p{margin:0;font:400 3.4cqw/1.2 var(--f-ui);color:var(--mute)}
.final header h2{margin:.6cqw 0 0;font:800 9cqw/1 var(--f-ui);letter-spacing:-.02em;text-wrap:balance}
.final ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2.6cqw;min-height:0}
.final li{display:grid;grid-template-columns:6cqw 1fr;gap:1.6cqw;opacity:0;transform:translateY(1.5cqw);transition:opacity .35s,transform .35s}
.final li.on{opacity:1;transform:none}
.final li em{font:700 2.8cqw/1.5 var(--f-mono);font-style:normal;color:var(--pink)}
.final li div{min-width:0}
.final li b{font:800 4.4cqw/1.15 var(--f-ui)}
.final li small{font:400 2.5cqw/1 var(--f-mono);color:var(--mute);margin-left:1.4cqw}
.final li p{margin:.5cqw 0 0;font:400 3cqw/1.3 var(--f-ui);color:#c6ccd8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.final .sc{font:700 2.4cqw/1 var(--f-mono);color:var(--cyan);margin-left:1.4cqw}
.final.dense ol{gap:1.7cqw} .final.dense li b{font-size:3.9cqw} .final.dense li p{font-size:2.7cqw}

.wm{position:absolute;left:0;right:0;bottom:0;padding:6cqw 0 2.6cqw;background:linear-gradient(transparent,var(--ink) 55%);text-align:center;font:600 2.5cqw/1 var(--f-mono);letter-spacing:.12em;color:rgba(233,237,245,.55);z-index:5}
.wm b{color:var(--pink)}
.count{position:absolute;inset:0;display:grid;place-items:center;font:800 40cqw/1 var(--f-mono);color:var(--pink);text-shadow:0 0 8cqw rgba(255,61,154,.6);z-index:9;pointer-events:none}

/* điều khiển */
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.ctl button{font:600 13px/1 var(--f-ui);color:var(--text);background:#141824;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.ctl button:hover{border-color:var(--mute)}
.ctl button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ctl button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#12030b}
.ctl .rec{background:var(--pink);border-color:var(--pink);color:#12030b}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:9px 11px}

/* chế độ quay */
body.rec .wrap{padding:0;gap:0;background:#000}
body.rec .cap, body.rec .ctl{display:none}
body.rec .stage{height:100%;width:auto;border-radius:0;box-shadow:none}
body.rec{cursor:none}
/* chế độ kể chuyện */
.brand,.scene,.cap2,.prog{display:none}
.story .brand{display:flex;position:absolute;left:4cqw;right:4cqw;top:3cqw;z-index:6;justify-content:center}
.brand span{font:700 2.5cqw/1 var(--f-mono);letter-spacing:.06em;padding:1.6cqw 3cqw;border:1px solid rgba(58,214,255,.45);border-radius:1.4cqw;background:rgba(10,13,20,.85);color:#bfefff}
.story .scene{display:flex;flex-direction:column;gap:1.2cqw;position:absolute;left:4.5cqw;right:4.5cqw;top:11cqw;z-index:6}
.scene i{font:700 2.3cqw/1 var(--f-mono);font-style:normal;letter-spacing:.14em;color:#3dff9a}
.scene h3{margin:0;font:800 5.4cqw/1.12 var(--f-mono);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;text-shadow:0 0 3cqw rgba(10,13,20,.9)}
.scene.flip h3,.scene.flip i{animation:sceneIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes sceneIn{from{opacity:0;transform:translateY(1.5cqw)}to{opacity:1;transform:none}}
.story .hud{transition:opacity .4s;top:29cqw;padding-top:2cqw;background:linear-gradient(transparent,rgba(10,13,20,.92) 30%,rgba(10,13,20,.92) 70%,transparent)}
.story .hud b{font-size:4.6cqw}
.story .cap2{display:flex;position:absolute;left:5cqw;right:5cqw;bottom:12cqw;z-index:6;justify-content:center}
.cap2 p{margin:0;max-width:100%;font:700 3.9cqw/1.35 var(--f-ui);text-align:center;padding:2cqw 3.4cqw;border-radius:2cqw;border:1px solid rgba(61,255,154,.35);background:rgba(6,16,12,.9);text-wrap:balance}
.cap2 em{font-style:normal;color:#3dff9a;text-shadow:0 0 2cqw rgba(61,255,154,.5)}
.cap2 .dim{color:rgba(233,237,245,.45)}
.story .prog{display:flex;flex-direction:column;gap:1.6cqw;position:absolute;left:0;right:0;bottom:0;padding:4cqw 5cqw 3cqw;z-index:5;background:linear-gradient(transparent,var(--ink) 45%)}
.prog div{height:.7cqw;border-radius:1cqw;background:#1b2230;overflow:hidden}
.prog div b{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dff9a,#3ad6ff)}
.prog p{margin:0;display:flex;justify-content:space-between;font:700 2.2cqw/1 var(--f-mono);letter-spacing:.12em;color:var(--mute)}
.prog p span:first-child{color:var(--pink)}
.story .wm{display:none}
.story .judge{bottom:24cqw}
.story.fin .hud{opacity:0}
.story .final{top:30cqw;bottom:22cqw}
.story .final ol{gap:1.5cqw} .story .final li b{font-size:3.8cqw} .story .final li p{font-size:2.6cqw}
.story .final header h2{font-size:7.5cqw}
@media (prefers-reduced-motion: reduce){ .scene.flip h3,.scene.flip i{animation:none} }
@media (prefers-reduced-motion: reduce){ .judge,.final,.final li,.keep{transition:none} }
</style>

<div class="wrap">
  <div class="cap" id="cap"><b>RepoScout</b><span id="runlabel">đang tải…</span></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="c"><span>NHỆN</span><b id="hC">0</b></div>
      <div><span>TRANG</span><b id="hP">0</b></div>
      <div><span>CHỮ ĐÃ ĐỌC</span><b id="hW">0</b></div>
      <div class="p"><span>GỬI SISUFX</span><b id="hS">0</b></div>
    </div>
    <div class="judge" id="judge">
      <div class="av">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3d9a"/><stop offset="1" stop-color="#8b5cff"/></linearGradient></defs>
          <circle cx="50" cy="50" r="46" fill="#1a0814" stroke="url(#g)" stroke-width="5"/>
          <polygon points="50,20 76,35 76,65 50,80 24,65 24,35" fill="none" stroke="#ff3d9a" stroke-width="3"/>
          <text x="50" y="62" text-anchor="middle" font-family="JetBrains Mono, monospace" font-weight="700" font-size="34" fill="#fff">S</text>
        </svg>
        <span>SISUFX</span>
      </div>
      <div>
        <p class="jq">repo này đáng xem không?</p>
        <div class="jrow">
          <div class="jn"><span>BỎ QUA</span><b id="jS">0</b></div>
          <div class="jn k"><span>GIỮ</span><b id="jK">0</b></div>
          <div class="keep" id="kc"><i>GIỮ</i><b id="kN">—</b><small id="kT"></small></div>
        </div>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <section class="final" id="final">
      <header><p>Sisufx giữ lại</p><h2 id="fH">0 repo</h2></header>
      <ol id="fL"></ol>
    </section>
    <div class="wm"><b>Sisufx</b> · t.me/sisufxgold</div>
    <div class="brand"><span>Sisufx · RepoScout · Săn repo mỗi sáng</span></div>
    <div class="scene" id="scene"><i id="sEy"></i><h3 id="sTi"></h3></div>
    <div class="cap2"><p id="cap2"></p></div>
    <div class="prog"><div><b id="pb"></b></div><p><span>SISUFX · t.me/sisufxgold</span><span id="pn">01 / 05</span></p></div>
    <div class="count" id="cd" hidden></div>
  </div>
  <div class="ctl">
    <button id="bPlay" type="button">↻ Phát lại</button>
    <div class="seg" role="group" aria-label="Độ dài clip">
      <button type="button" data-d="15">15s</button><button type="button" data-d="30">30s</button><button type="button" data-d="60">60s</button>
    </div>
    <button id="bStory" type="button" aria-pressed="true">📖 Kể chuyện</button>
    <button id="bSnd" type="button" aria-pressed="false">🔇 Âm thanh</button>
    <button id="bRec" class="rec" type="button">● Quay TikTok</button>
  </div>
</div>

<script>
(() => {
"use strict";
// ---------------------------------------------------------------- dữ liệu mẫu (dùng khi chưa có lượt quét thật)
const SAMPLE = (() => {
  const kept = [
    ["JustVugg/colibri","chạy model 744B trên 16GB RAM",9,"ai"],
    ["jamiepine/voicebox","clone giọng nói, 23 ngôn ngữ, offline",8,"ai"],
    ["Tencent/BrowserSkill","agent dùng trình duyệt đã đăng nhập của bạn",8,"ai"],
    ["cloudflare/security-audit-skill","bộ săn lỗi bảo mật của Cloudflare",8,"ai"],
    ["alibaba/open-code-review","AI review code của Alibaba",7,"ai"],
    ["addyosmani/agent-skills","25 quy trình kỹ sư senior cho agent",7,"ai"],
    ["alphaXiv/OpenResearch","biến coding agent thành research agent",7,"ai"],
    ["Tencent/WeKnora","tài liệu của bạn → RAG, agent, wiki",7,"ai"],
    ["affaan-m/ECC","68 agent, 293 skill",6,"ai"]
  ].map(([n,t,s,c]) => ({n,t,s,c,u:"https://github.com/"+n}));
  const judged = []; let k = 0;
  for (let i = 0; i < 65; i++) { const keep = (i % 7 === 3) && k < kept.length; judged.push({n: keep ? kept[k++].n : "x/"+i, k: keep ? 1 : 0}); }
  const tr = ["alibaba/open-code-review","cloudflare/security-audit-skill","addyosmani/agent-skills","Tencent/BrowserSkill","alphaXiv/OpenResearch","anthropics/claude-code","Tencent/WeKnora"];
  const labels = ["Trending · Tất cả","Trending · Python","Trending · TypeScript","topic:ai-agents","topic:mcp-server","claude","agent skills","language:MQL5","topic:metatrader5","xauusd","topic:algorithmic-trading","topic:solana"];
  return { v:1, id:"mau", label:"Dữ liệu mẫu từ video", sample:true,
    stats:{crawlers:128, pages:12, words:2363, judged:65},
    sources: labels.map((l,i) => ({label:l, items: i === 0 ? tr : tr.slice(i % 4).concat(tr.slice(0, i % 4)).slice(0,5)})),
    judged, kept };
})();

// ---------------------------------------------------------------- kịch bản kể chuyện
const SCENE_AT = [0, .12, .31, .62, .79, 1];
function defaultStory(run){
  const st = run.stats || {}, kept = run.kept || [], top = kept[0];
  const f = n => Math.round(n || 0).toLocaleString("vi-VN");
  return [
    {eyebrow:"GITHUB TRENDING", title:"Sáng nay GitHub có gì hot?", caption:`Mỗi sáng Sisufx thả nhện đi đọc GitHub Trending và ${f(st.pages)} nguồn tìm kiếm.`},
    {eyebrow:"SPIDER SWARM", title:"Thả đàn nhện đi đọc", caption:`${f(st.crawlers)} lượt nhện bò qua các trang, đọc ${f(st.words)} chữ README.`},
    {eyebrow:"AI JUDGE", title:"Sisufx chấm từng repo", caption:`${f(st.judged)} repo được hỏi đúng một câu: có đáng thời gian của bạn không?`},
    {eyebrow:"TOP PICK", title: top ? top.n.split("/").pop() : "Chưa có repo nổi bật", caption: top ? `${top.t || "Repo đáng xem nhất hôm nay"}. Sisufx chấm ${top.s}/10.` : "Hôm nay chưa repo nào vượt ngưỡng."},
    {eyebrow:"DAILY DIGEST", title:`Giữ lại ${kept.length} repo`, caption:"Đây là danh sách đáng xem nhất hôm nay. Theo dõi t.me/sisufxgold để nhận mỗi sáng."}
  ];
}
let STORY = [], storyOn = true, curScene = -1, curChunk = "";
function sceneAt(p){ for (let i = SCENE_AT.length - 2; i >= 0; i--) if (p >= SCENE_AT[i]) return i; return 0; }
function renderStory(p){
  const si = sceneAt(p), sc = STORY[si] || {eyebrow:"",title:"",caption:""};
  const box = $("scene");
  if (si !== curScene) {
    curScene = si; $("sEy").textContent = sc.eyebrow || ""; $("sTi").textContent = sc.title || "";
    box.classList.remove("flip"); void box.offsetWidth; box.classList.add("flip");
    $("pn").textContent = String(si+1).padStart(2,"0") + " / " + String(STORY.length).padStart(2,"0");
    if (p > 0.001 && p < 1) snd.tone(520, .09, "triangle", .05);
  }
  $("pb").style.width = (p*100).toFixed(2) + "%";
  // phụ đề karaoke: chia câu thành cụm 6 chữ, chữ đang "đọc" sáng màu
  const words = (sc.caption || "").split(/\s+/).filter(Boolean);
  if (!words.length) { $("cap2").textContent = ""; return; }
  const local = clamp((p - SCENE_AT[si]) / (SCENE_AT[si+1] - SCENE_AT[si]) / .9);
  const wi = Math.min(words.length - 1, Math.floor(local * words.length));
  const c0 = Math.floor(wi / 6) * 6, chunk = words.slice(c0, c0 + 6);
  const key = si + ":" + wi;
  if (key === curChunk) return; curChunk = key;
  const el2 = $("cap2"); el2.textContent = "";
  chunk.forEach((w, k) => { const n = document.createElement(c0 + k === wi ? "em" : "span"); if (c0 + k > wi) n.className = "dim";
    n.textContent = w; el2.append(n, document.createTextNode(k < chunk.length - 1 ? " " : "")); });
}

// ---------------------------------------------------------------- tải dữ liệu
async function loadRun(){
  let id = null;
  try { id = new URLSearchParams(location.search).get("r") || (location.hash.slice(1) || null); } catch(e) {}
  const paths = id ? ["runs/" + encodeURIComponent(id) + ".json"] : [];
  paths.push("runs/latest.json");
  for (const p of paths) {
    try { const r = await fetch(p, {cache:"no-store"}); if (r.ok) { const j = await r.json(); if (j && j.stats) return j; } } catch(e) {}
  }
  return SAMPLE;
}

// ---------------------------------------------------------------- tiện ích
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
const lerp = (a,b,t) => a + (b-a)*t;
const ease = t => t<.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
const seg = (p,a,b) => clamp((p-a)/(b-a));
const fmt = n => Math.round(n).toLocaleString("en-US");
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
const COLORS = ["#3ad6ff","#ff3d9a","#8b5cff","#3dff9a","#ffd23d","#5b8cff"];
const store = { get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e) {} } };

// ---------------------------------------------------------------- âm thanh (WebAudio, tự tổng hợp)
const snd = { ctx:null, on:false, lastTick:0,
  ensure(){ if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(f, dur, type="sine", vol=.12, slide=0){ if (!this.on || !this.ctx) return; const c=this.ctx, t=c.currentTime, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); if (slide) o.frequency.exponentialRampToValueAtTime(f*slide, t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.02); },
  tick(){ const n = performance.now(); if (n - this.lastTick < 70) return; this.lastTick = n; this.tone(1800 + Math.random()*900, .025, "square", .025); },
  keep(){ this.tone(880,.18,"sine",.14); setTimeout(()=>this.tone(1320,.28,"sine",.12),90); },
  skip(){ this.tone(240,.07,"triangle",.05,.7); },
  swoosh(){ this.tone(300,.5,"sawtooth",.03,3); }
};

// ---------------------------------------------------------------- cảnh
const W = 1080, H = 1920;
const cv = $("cv"), ctx = cv.getContext("2d");
let RUN, TILES = [], SPIDERS = [], HL = [], STREAKS = [], N = 128;
let dur = Number(store.get("rs_dur")) || 30, t0 = performance.now(), playing = true, lastP = 0, lastIdx = 0, lastNow = t0, finalShown = false;

function buildScene(){
  seed = 7;
  const src = RUN.sources && RUN.sources.length ? RUN.sources : SAMPLE.sources;
  const cols = 3, rows = 4, gx = 40, gy = 190, gap = 24;
  const tw = (W - 2*gx - (cols-1)*gap)/cols, th = (1770 - gy - (rows-1)*gap)/rows;
  TILES = [];
  for (let i = 0; i < cols*rows; i++) {
    const s = src[i % src.length];
    const items = (s.items && s.items.length ? s.items : ["…/…"]).slice(0,7).map(n => ({n, a: .45 + rnd()*.5, b: .3 + rnd()*.55, c: COLORS[(rnd()*COLORS.length)|0]}));
    TILES.push({x: gx + (i%cols)*(tw+gap), y: gy + ((i/cols)|0)*(th+gap), w: tw, h: th, label: s.label || "", trending: /^Trending/.test(s.label||""), items});
  }
  N = clamp(Math.round(RUN.stats.crawlers || 128), 8, 128);
  SPIDERS = [];
  const t = TILES[0];
  for (let i = 0; i < N; i++) {
    const x = t.x + t.w*(.2+rnd()*.6), y = t.y + t.h*(.25+rnd()*.6);
    SPIDERS.push({x, y, tx:x, ty:y, sp: 55 + rnd()*90, c: COLORS[i % COLORS.length], ph: rnd()*6.28, legs: 6 + ((rnd()*3)|0), r: 2.2 + rnd()*1.6, wait: rnd()});
  }
  HL = []; STREAKS = [];
}

function pickTarget(s, wide){
  const t = wide ? TILES[(rnd()*TILES.length)|0] : TILES[0];
  const row = (rnd()*t.items.length)|0;
  s.tx = t.x + 10 + rnd()*(t.w-20); s.ty = t.y + 70 + row*42 + rnd()*20; s.tile = t; s.row = row;
}

function camera(p){
  const t = TILES[0], a = ease(seg(p,.12,.30));
  const z = lerp(3.05, 1, a), cx = lerp(t.x + t.w/2, W/2, a), cy = lerp(t.y + t.h/2 + 20, 980, a);
  return {z, cx, cy};
}

function drawTile(t, alpha){
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#0d1117"; ctx.strokeStyle = "#262c38"; ctx.lineWidth = 1.2;
  roundRect(t.x, t.y, t.w, t.h, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#7d8597"; ctx.font = "500 9px 'JetBrains Mono', monospace"; ctx.fillText(t.label.slice(0,34), t.x+10, t.y+16);
  ctx.fillStyle = "#e9edf5"; ctx.font = "800 15px 'Be Vietnam Pro', sans-serif"; ctx.fillText(t.trending ? "Trending" : "Kết quả tìm", t.x+10, t.y+38);
  ctx.fillStyle = "#7d8597"; ctx.font = "400 7px 'Be Vietnam Pro', sans-serif"; ctx.fillText(t.trending ? "Repo cộng đồng GitHub quan tâm nhất hôm nay" : "GitHub Search · sắp theo sao", t.x+10, t.y+50);
  t.items.forEach((it, r) => {
    const y = t.y + 70 + r*42; if (y + 30 > t.y + t.h) return;
    ctx.strokeStyle = "#3a4150"; ctx.lineWidth = 1; ctx.strokeRect(t.x+10, y-7, 7, 7);
    ctx.fillStyle = "#58a6ff"; ctx.font = "600 9.5px 'Be Vietnam Pro', sans-serif"; ctx.fillText(it.n.replace("/", " / ").slice(0,36), t.x+22, y);
    ctx.fillStyle = "#2a303c"; ctx.fillRect(t.x+10, y+7, (t.w-20)*it.a, 4); ctx.fillRect(t.x+10, y+14, (t.w-20)*it.b, 4);
    ctx.fillStyle = it.c; ctx.beginPath(); ctx.arc(t.x+13, y+25, 2.2, 0, 6.29); ctx.fill();
    ctx.fillStyle = "#3a4150"; ctx.fillRect(t.x+19, y+23.5, 26, 3); ctx.fillRect(t.x+t.w-48, y+23.5, 38, 3);
  });
  ctx.globalAlpha = 1;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

function drawSpider(s, now){
  const n = s.legs, len = 9 + s.r*2.2;
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c; ctx.lineWidth = .9;
  for (let i = 0; i < n; i++) {
    const a = (i/n)*6.283 + s.ph*.3, w = Math.sin(now*.012 + s.ph + i) * .35;
    const kx = s.x + Math.cos(a+w)*len*.55, ky = s.y + Math.sin(a+w)*len*.55;
    const fx = s.x + Math.cos(a-w*.6)*len, fy = s.y + Math.sin(a-w*.6)*len;
    ctx.globalAlpha = .85; ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(kx,ky); ctx.lineTo(fx,fy); ctx.stroke();
    ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(fx,fy,.9,0,6.29); ctx.fill();
  }
  ctx.shadowColor = s.c; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.29); ctx.fill(); ctx.shadowBlur = 0;
}

function resize(){
  const r = cv.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
}

// ---------------------------------------------------------------- vòng lặp
const el = {hC:$("hC"),hP:$("hP"),hW:$("hW"),hS:$("hS"),jS:$("jS"),jK:$("jK"),kc:$("kc"),kN:$("kN"),kT:$("kT"),judge:$("judge"),final:$("final"),dots:$("dots")};
let keepIdx = []; // vị trí repo giữ trong judged
function frame(now){
  const dt = Math.min(.05, (now - lastNow)/1000); lastNow = now;
  const p = playing ? clamp((now - t0)/(dur*1000)) : lastP;
  lastP = p;
  const st = RUN.stats;
  // số nhện đang hoạt động
  const active = p < .12 ? Math.max(1, Math.round(Math.pow(8, seg(p,0,.12)))) : Math.round(lerp(8, N, ease(seg(p,.12,.30))));
  // --- vẽ
  const s = cv.width / W; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle = "#0a0d14"; ctx.fillRect(0,0,cv.width,cv.height);
  const cam = camera(p);
  ctx.setTransform(s*cam.z, 0, 0, s*cam.z, s*(W/2 - cam.cx*cam.z), s*(H/2 - cam.cy*cam.z));
  const dim = p > .32 ? lerp(1, .55, seg(p,.32,.4)) : 1;
  TILES.forEach(t => drawTile(t, dim));
  // vệt highlight kiểu bút dạ quang
  HL = HL.filter(h => now - h.t < 1600);
  HL.forEach(h => { const a = 1 - (now-h.t)/1600; ctx.globalAlpha = .55*a*dim; ctx.fillStyle = h.c; ctx.fillRect(h.x, h.y, h.w, 9); });
  ctx.globalAlpha = 1;
  // nhện
  const wide = p >= .12;
  for (let i = 0; i < active; i++) {
    const sp = SPIDERS[i];
    const dx = sp.tx - sp.x, dy = sp.ty - sp.y, d = Math.hypot(dx,dy);
    if (playing && p < 1) {
      if (d < 2) { sp.wait -= dt; if (sp.wait <= 0) {
          if (sp.tile && rnd() < .35) { HL.push({x: sp.tile.x + 20, y: sp.tile.y + 70 + sp.row*42 - 8, w: (sp.tile.w-30)*(.3+rnd()*.6), c: ["#ff3d9a","#ffd23d","#3ad6ff"][(rnd()*3)|0], t: now}); snd.tick(); }
          pickTarget(sp, wide); sp.wait = .2 + rnd()*.9; } }
      else { const v = Math.min(d, sp.sp*dt*(wide ? 1.4 : 1)); sp.x += dx/d*v; sp.y += dy/d*v; sp.ph += v*.05; }
    }
  }
  // tơ nối giữa các nhện gần nhau
  ctx.lineWidth = .6;
  for (let i = 0; i < active; i++) for (let j = i+1; j < active; j++) {
    const a = SPIDERS[i], b = SPIDERS[j], dd = Math.abs(a.x-b.x) + Math.abs(a.y-b.y);
    if (dd < 46) { ctx.globalAlpha = (1 - dd/46)*.55; ctx.strokeStyle = a.c; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  }
  ctx.globalAlpha = 1;
  for (let i = 0; i < active; i++) drawSpider(SPIDERS[i], now);
  // vệt bay về giám khảo (toạ độ màn hình)
  ctx.setTransform(s,0,0,s,0,0);
  STREAKS = STREAKS.filter(k => now - k.t < 650);
  STREAKS.forEach(k => { const q = (now-k.t)/650, e = ease(q);
    const x = lerp(k.x, 180, e), y = lerp(k.y, 1640, e), tx = lerp(k.x, 180, Math.max(0,e-.18)), ty = lerp(k.y, 1640, Math.max(0,e-.18));
    ctx.strokeStyle = k.keep ? "#ff3d9a" : "rgba(255,61,154,.55)"; ctx.lineWidth = k.keep ? 9 : 5; ctx.lineCap = "round";
    ctx.globalAlpha = 1-q*.6; ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(x,y); ctx.stroke(); });
  ctx.globalAlpha = 1;

  // --- bộ đếm
  el.hC.textContent = fmt(lerp(1, st.crawlers, (active-1)/Math.max(1,N-1)));
  el.hP.textContent = fmt(p < .12 ? 1 : lerp(1, st.pages, ease(seg(p,.12,.30))));
  el.hW.textContent = fmt(st.words * ease(seg(p,.03,.76)));
  const jp = seg(p,.34,.76), J = RUN.judged.length, idx = Math.floor(jp*J);
  el.hS.textContent = fmt(st.judged * jp);
  // --- giám khảo
  el.judge.classList.toggle("on", p >= .31 && p < .79);
  if (idx !== lastIdx) {
    if (idx > lastIdx) for (let i = lastIdx; i < idx && i < J; i++) {
      const it = RUN.judged[i]; const tt = TILES[(i*5)%TILES.length];
      const sx = (tt.x + tt.w*(.2+rnd()*.6) - cam.cx)*cam.z + W/2, sy = (tt.y + tt.h*rnd() - cam.cy)*cam.z + H/2;
      STREAKS.push({x: sx, y: sy, t: now, keep: !!it.k});
      if (it.k) snd.keep(); else snd.skip();
    }
    lastIdx = idx;
  }
  let skips = 0, keeps = 0, lastKeep = null;
  for (let i = 0; i < Math.min(idx, J); i++) { if (RUN.judged[i].k) { keeps++; lastKeep = RUN.judged[i].n; } else skips++; }
  el.jS.textContent = skips; el.jK.textContent = keeps;
  if (lastKeep) { const kk = RUN.kept.find(x => x.n === lastKeep) || {n:lastKeep,t:""}; const nm = kk.n.split("/").pop();
    if (el.kN.textContent !== nm) { el.kN.textContent = nm; el.kT.textContent = kk.t || ""; } el.kc.classList.add("on"); }
  else el.kc.classList.remove("on");
  const dots = el.dots.children; const nd = Math.round(jp*dots.length); for (let i = 0; i < dots.length; i++) dots[i].classList.toggle("on", i < nd);
  if (storyOn) renderStory(p);
  // --- danh sách cuối
  const fin = p >= .79; el.final.classList.toggle("on", fin); $("stage").classList.toggle("fin", fin);
  if (fin && !finalShown) { finalShown = true; snd.swoosh(); }
  const lis = $("fL").children;
  for (let i = 0; i < lis.length; i++) { const on = p >= .81 + i*(.12/Math.max(lis.length,1)); if (on && !lis[i].classList.contains("on")) { lis[i].classList.add("on"); snd.tone(1200+i*60,.08,"sine",.05); } if (!on) lis[i].classList.remove("on"); }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- dựng DOM theo dữ liệu
function render(){
  $("runlabel").textContent = RUN.label || RUN.id || "";
  if (RUN.sample) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "Dữ liệu mẫu"; $("cap").appendChild(b); }
  const kept = RUN.kept || [];
  $("fH").textContent = kept.length ? kept.length + " repo" : "0 repo";
  const ol = $("fL"); ol.innerHTML = "";
  if (!kept.length) { const li = document.createElement("li"); li.innerHTML = "<em>—</em><div><b>Hôm nay không repo nào đạt chuẩn</b></div>"; ol.appendChild(li); }
  kept.slice(0,10).forEach((k,i) => {
    const li = document.createElement("li"), [owner, name] = k.n.includes("/") ? k.n.split("/") : ["", k.n];
    const em = document.createElement("em"); em.textContent = String(i+1).padStart(2,"0");
    const d = document.createElement("div"), b = document.createElement("b"), sm = document.createElement("small"), sc = document.createElement("span"), pp = document.createElement("p");
    b.textContent = name; sm.textContent = owner; sc.className = "sc"; sc.textContent = k.s ? k.s + "/10" : ""; pp.textContent = k.t || "";
    d.append(b, sm, sc, pp); li.append(em, d); ol.appendChild(li);
  });
  $("final").classList.toggle("dense", kept.length > 7);
  for (let i = 0; i < 10; i++) el.dots.appendChild(document.createElement("i"));
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.d) === dur)));
}

function restart(){ curScene = -1; curChunk = ""; buildScene(); t0 = performance.now(); playing = true; lastIdx = 0; finalShown = false;
  document.querySelectorAll("#fL li").forEach(li => li.classList.remove("on")); }

// ---------------------------------------------------------------- điều khiển
$("bPlay").onclick = () => { snd.ensure(); restart(); };
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { dur = Number(b.dataset.d); store.set("rs_dur", String(dur));
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); restart(); });
$("bStory").onclick = () => { storyOn = !storyOn; store.set("rs_story", storyOn ? "1" : "0");
  $("stage").classList.toggle("story", storyOn); $("bStory").setAttribute("aria-pressed", String(storyOn)); curScene = -1; curChunk = ""; restart(); };
$("bSnd").onclick = () => { snd.ensure(); snd.on = !snd.on; $("bSnd").setAttribute("aria-pressed", String(snd.on)); $("bSnd").textContent = (snd.on ? "🔊" : "🔇") + " Âm thanh"; };
$("bRec").onclick = async () => {
  snd.ensure(); document.body.classList.add("rec");
  try { await document.documentElement.requestFullscreen?.(); } catch(e) {}
  setTimeout(() => { resize(); }, 120);
  playing = false; lastP = 0; curScene = -1; curChunk = ""; buildScene(); finalShown = false; lastIdx = 0; document.querySelectorAll("#fL li").forEach(li => li.classList.remove("on"));
  const cd = $("cd"); cd.hidden = false;
  for (const n of ["3","2","1"]) { cd.textContent = n; snd.tone(660,.12,"sine",.08); await new Promise(r => setTimeout(r, 750)); }
  cd.hidden = true; t0 = performance.now(); playing = true;
};
// chạm vào sân khấu khi đang quay và clip đã xong -> thoát chế độ quay
$("stage").addEventListener("click", () => { if (document.body.classList.contains("rec") && lastP >= 1) {
  document.body.classList.remove("rec"); try { document.fullscreenElement && document.exitFullscreen(); } catch(e) {} setTimeout(resize, 120); } });
window.addEventListener("resize", resize);

loadRun().then(r => {
  RUN = r; RUN.judged = RUN.judged || []; RUN.kept = RUN.kept || [];
  storyOn = (store.get("rs_story") ?? "1") === "1";
  STORY = (Array.isArray(RUN.story) && RUN.story.length === 5) ? RUN.story : defaultStory(RUN);
  $("stage").classList.toggle("story", storyOn); $("bStory").setAttribute("aria-pressed", String(storyOn));
  render(); resize(); buildScene();
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { playing = false; lastP = 1; }
  t0 = performance.now(); requestAnimationFrame(frame);
});
})();
</script>
